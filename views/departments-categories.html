<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Departments & Categories</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<main class="container">

    <h1>Departments & Categories</h1>

    <p class="subtitle">
        Organize departments and complaint categories under each organization.
    </p>


    <!-- DEPARTMENTS -->

    <section class="card">

        <h2>Add Department</h2>

        <form id="department-form">

            <label for="department-organization">
                Organization
            </label>

            <select id="department-organization" required>
                <option value="">Select organization</option>
            </select>


            <label for="department-name">
                Department Name
            </label>

            <input
                type="text"
                id="department-name"
                placeholder="Customer Support"
                maxlength="100"
                required
            >


            <label for="department-description">
                Description
            </label>

            <textarea
                id="department-description"
                rows="3"
                placeholder="Department description"
            ></textarea>


            <button type="submit">
                Add Department
            </button>

        </form>

        <p id="department-message"></p>

    </section>


    <section class="card">

        <div class="section-header">

            <h2>Departments</h2>

            <button
                type="button"
                class="secondary"
                onclick="loadDepartments()"
            >
                Refresh
            </button>

        </div>

        <div id="department-list">
            Loading...
        </div>

    </section>



    <!-- CATEGORIES -->

    <section class="card">

        <h2>Add Category</h2>

        <form id="category-form">

            <label for="category-organization">
                Organization
            </label>

            <select id="category-organization" required>
                <option value="">Select organization</option>
            </select>


            <label for="category-name">
                Category Name
            </label>

            <input
                type="text"
                id="category-name"
                placeholder="Billing Issue"
                maxlength="100"
                required
            >


            <label for="category-description">
                Description
            </label>

            <textarea
                id="category-description"
                rows="3"
                placeholder="Category description"
            ></textarea>


            <button type="submit">
                Add Category
            </button>

        </form>

        <p id="category-message"></p>

    </section>


    <section class="card">

        <div class="section-header">

            <h2>Categories</h2>

            <button
                type="button"
                class="secondary"
                onclick="loadCategories()"
            >
                Refresh
            </button>

        </div>

        <div id="category-list">
            Loading...
        </div>

    </section>

</main>



<script>

async function loadOrganizations() {

    try {

        const response =
            await fetch("/api/organizations");

        const data =
            await response.json();

        if (!data.success) {
            throw new Error(data.message);
        }


        const departmentSelect =
            document.getElementById(
                "department-organization"
            );

        const categorySelect =
            document.getElementById(
                "category-organization"
            );


        const options = data.organizations
            .map(org => `
                <option value="${org.organization_id}">
                    ${escapeHtml(org.name)}
                </option>
            `)
            .join("");


        departmentSelect.innerHTML =
            `<option value="">Select organization</option>`
            + options;

        categorySelect.innerHTML =
            `<option value="">Select organization</option>`
            + options;

    } catch (error) {

        alert(
            "Failed to load organizations: "
            + error.message
        );
    }
}



async function loadDepartments() {

    const list =
        document.getElementById(
            "department-list"
        );

    try {

        const response =
            await fetch("/api/departments");

        const data =
            await response.json();

        if (!data.success) {
            throw new Error(data.message);
        }


        if (data.departments.length === 0) {

            list.innerHTML =
                "<p>No departments added yet.</p>";

            return;
        }


        list.innerHTML =
            data.departments.map(department => `

                <article class="organization-item">

                    <div>

                        <h3>
                            ${escapeHtml(
                                department.name
                            )}
                        </h3>

                        <p>
                            <strong>
                                Organization:
                            </strong>

                            ${escapeHtml(
                                department.organization_name
                            )}
                        </p>

                        <p>
                            ${escapeHtml(
                                department.description ||
                                "No description"
                            )}
                        </p>

                    </div>

                    <button
                        type="button"
                        class="danger"
                        onclick="deleteDepartment(
                            ${department.department_id}
                        )"
                    >
                        Delete
                    </button>

                </article>

            `).join("");

    } catch (error) {

        list.innerHTML =
            `<p class="error">
                ${escapeHtml(error.message)}
            </p>`;
    }
}



async function loadCategories() {

    const list =
        document.getElementById(
            "category-list"
        );

    try {

        const response =
            await fetch("/api/categories");

        const data =
            await response.json();

        if (!data.success) {
            throw new Error(data.message);
        }


        if (data.categories.length === 0) {

            list.innerHTML =
                "<p>No categories added yet.</p>";

            return;
        }


        list.innerHTML =
            data.categories.map(category => `

                <article class="organization-item">

                    <div>

                        <h3>
                            ${escapeHtml(
                                category.name
                            )}
                        </h3>

                        <p>
                            <strong>
                                Organization:
                            </strong>

                            ${escapeHtml(
                                category.organization_name
                            )}
                        </p>

                        <p>
                            ${escapeHtml(
                                category.description ||
                                "No description"
                            )}
                        </p>

                    </div>

                    <button
                        type="button"
                        class="danger"
                        onclick="deleteCategory(
                            ${category.category_id}
                        )"
                    >
                        Delete
                    </button>

                </article>

            `).join("");

    } catch (error) {

        list.innerHTML =
            `<p class="error">
                ${escapeHtml(error.message)}
            </p>`;
    }
}



document
    .getElementById("department-form")
    .addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const response =
                await fetch(
                    "/api/departments",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            organization_id:
                                document.getElementById(
                                    "department-organization"
                                ).value,

                            name:
                                document.getElementById(
                                    "department-name"
                                ).value,

                            description:
                                document.getElementById(
                                    "department-description"
                                ).value

                        })
                    }
                );


            const data =
                await response.json();


            document.getElementById(
                "department-message"
            ).textContent =
                data.message;


            if (data.success) {

                event.target.reset();

                loadDepartments();
            }
        }
    );



document
    .getElementById("category-form")
    .addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const response =
                await fetch(
                    "/api/categories",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            organization_id:
                                document.getElementById(
                                    "category-organization"
                                ).value,

                            name:
                                document.getElementById(
                                    "category-name"
                                ).value,

                            description:
                                document.getElementById(
                                    "category-description"
                                ).value

                        })
                    }
                );


            const data =
                await response.json();


            document.getElementById(
                "category-message"
            ).textContent =
                data.message;


            if (data.success) {

                event.target.reset();

                loadCategories();
            }
        }
    );



async function deleteDepartment(id) {

    if (!confirm("Delete this department?")) {
        return;
    }

    const response =
        await fetch(
            `/api/departments/${id}`,
            {
                method: "DELETE"
            }
        );

    const data =
        await response.json();

    alert(data.message);

    loadDepartments();
}



async function deleteCategory(id) {

    if (!confirm("Delete this category?")) {
        return;
    }

    const response =
        await fetch(
            `/api/categories/${id}`,
            {
                method: "DELETE"
            }
        );

    const data =
        await response.json();

    alert(data.message);

    loadCategories();
}



function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}



loadOrganizations();

loadDepartments();

loadCategories();

</script>

</body>
</html>
