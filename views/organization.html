<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Organization Management</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="container">

        <h1>Organization Management</h1>

        <p class="subtitle">
            Manage organizations registered in the complaint management system.
        </p>


        <!-- Add / Edit Organization -->

        <section class="card">

            <h2 id="form-title">Add Organization</h2>

            <form id="organization-form">

                <input type="hidden" id="organization-id">


                <label for="name">
                    Organization Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter organization name"
                    maxlength="150"
                    required
                >


                <label for="type">
                    Organization Type
                </label>

                <input
                    type="text"
                    id="type"
                    placeholder="Company, Hospital, Municipality, etc."
                    maxlength="100"
                    required
                >


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    rows="4"
                    placeholder="Enter a short description"
                ></textarea>


                <div class="actions">

                    <button
                        type="submit"
                        id="submit-button"
                    >
                        Add Organization
                    </button>

                    <button
                        type="button"
                        id="cancel-button"
                        class="secondary"
                        hidden
                    >
                        Cancel
                    </button>

                </div>

            </form>

            <p id="form-message"></p>

        </section>



        <!-- Organization List -->

        <section class="card">

            <div class="section-header">

                <h2>Organizations</h2>

                <button
                    type="button"
                    id="refresh-button"
                    class="secondary"
                >
                    Refresh
                </button>

            </div>

            <div id="organization-list">
                Loading...
            </div>

        </section>

    </main>


    <script>

        const form =
            document.getElementById("organization-form");

        const organizationId =
            document.getElementById("organization-id");

        const nameInput =
            document.getElementById("name");

        const typeInput =
            document.getElementById("type");

        const descriptionInput =
            document.getElementById("description");

        const list =
            document.getElementById("organization-list");

        const formMessage =
            document.getElementById("form-message");

        const formTitle =
            document.getElementById("form-title");

        const submitButton =
            document.getElementById("submit-button");

        const cancelButton =
            document.getElementById("cancel-button");



        // Load all organizations

        async function loadOrganizations() {

            list.textContent = "Loading...";

            try {

                const response =
                    await fetch("/api/organizations");

                const data =
                    await response.json();


                if (!data.success) {
                    throw new Error(data.message);
                }


                if (data.organizations.length === 0) {

                    list.innerHTML =
                        "<p>No organizations added yet.</p>";

                    return;
                }


                list.innerHTML =
                    data.organizations
                        .map(org => `

                            <article class="organization-item">

                                <div>

                                    <h3>
                                        ${escapeHtml(org.name)}
                                    </h3>

                                    <p>
                                        <strong>Type:</strong>
                                        ${escapeHtml(org.type)}
                                    </p>

                                    <p>
                                        ${escapeHtml(
                                            org.description ||
                                            "No description"
                                        )}
                                    </p>

                                </div>


                                <div class="actions">

                                    <button
                                        type="button"
                                        onclick="editOrganization(${org.organization_id})"
                                    >
                                        Edit
                                    </button>

                                    <button
                                        type="button"
                                        class="danger"
                                        onclick="deleteOrganization(${org.organization_id})"
                                    >
                                        Delete
                                    </button>

                                </div>

                            </article>

                        `)
                        .join("");

            } catch (error) {

                list.innerHTML =
                    `<p class="error">
                        ${escapeHtml(error.message)}
                    </p>`;
            }
        }



        // Add / Update organization

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            formMessage.textContent = "";


            const id = organizationId.value;

            const method =
                id ? "PUT" : "POST";

            const url =
                id
                    ? `/api/organizations/${id}`
                    : "/api/organizations";


            try {

                const response =
                    await fetch(url, {

                        method,

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            name: nameInput.value,

                            type: typeInput.value,

                            description:
                                descriptionInput.value

                        })

                    });


                const data =
                    await response.json();


                if (!data.success) {
                    throw new Error(data.message);
                }


                formMessage.textContent =
                    data.message;


                resetForm();

                loadOrganizations();


            } catch (error) {

                formMessage.textContent =
                    error.message;
            }

        });



        // Edit organization

        async function editOrganization(id) {

            try {

                const response =
                    await fetch(
                        `/api/organizations/${id}`
                    );

                const data =
                    await response.json();


                if (!data.success) {
                    throw new Error(data.message);
                }


                const organization =
                    data.organization;


                organizationId.value =
                    organization.organization_id;

                nameInput.value =
                    organization.name;

                typeInput.value =
                    organization.type;

                descriptionInput.value =
                    organization.description || "";


                formTitle.textContent =
                    "Edit Organization";

                submitButton.textContent =
                    "Update Organization";

                cancelButton.hidden =
                    false;


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });


            } catch (error) {

                alert(error.message);
            }
        }



        // Delete organization

        async function deleteOrganization(id) {

            const confirmed =
                confirm(
                    "Delete this organization?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/organizations/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {
                    throw new Error(data.message);
                }


                loadOrganizations();


            } catch (error) {

                alert(error.message);
            }
        }



        // Reset form

        function resetForm() {

            form.reset();

            organizationId.value = "";

            formTitle.textContent =
                "Add Organization";

            submitButton.textContent =
                "Add Organization";

            cancelButton.hidden =
                true;
        }



        cancelButton.addEventListener(
            "click",
            resetForm
        );


        document
            .getElementById("refresh-button")
            .addEventListener(
                "click",
                loadOrganizations
            );



        // Prevent HTML injection

        function escapeHtml(value) {

            return String(value)

                .replaceAll("&", "&amp;")

                .replaceAll("<", "&lt;")

                .replaceAll(">", "&gt;")

                .replaceAll('"', "&quot;")

                .replaceAll("'", "&#039;");
        }



        // Initial load

        loadOrganizations();

    </script>

</body>
</html>
