<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Resolution & Feedback</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

<main class="container">

    <h1>Resolution & Feedback</h1>

    <p class="subtitle">
        Resolve complaints, close them and collect user feedback.
    </p>


    <!-- SELECT COMPLAINT -->

    <section class="card">

        <h2>Select Complaint</h2>

        <select id="complaint-select">

            <option value="">
                Select complaint
            </option>

        </select>

    </section>



    <!-- RESOLUTION -->

    <section
        class="card"
        id="resolution-section"
    >

        <h2>Resolve Complaint</h2>

        <p id="complaint-info"></p>


        <label for="resolver">
            Resolved By
        </label>

        <select id="resolver">

            <option value="">
                Select staff member
            </option>

        </select>


        <label for="resolution-text">
            Resolution
        </label>

        <textarea
            id="resolution-text"
            rows="5"
            placeholder="Describe how the complaint was resolved..."
        ></textarea>


        <button
            type="button"
            onclick="submitResolution()"
        >
            Resolve Complaint
        </button>


        <p id="resolution-message"></p>

    </section>



    <!-- CLOSE -->

    <section
        class="card"
        id="close-section"
    >

        <h2>Close Complaint</h2>

        <label for="closed-by">
            Closed By
        </label>

        <select id="closed-by">

            <option value="">
                Select user
            </option>

        </select>


        <label for="close-remarks">
            Remarks
        </label>

        <textarea
            id="close-remarks"
            rows="3"
            placeholder="Optional closing remarks..."
        ></textarea>


        <button
            type="button"
            onclick="closeComplaint()"
        >
            Close Complaint
        </button>


        <p id="close-message"></p>

    </section>



    <!-- FEEDBACK -->

    <section
        class="card"
        id="feedback-section"
    >

        <h2>User Feedback</h2>


        <label for="feedback-user">
            User
        </label>

        <select id="feedback-user">

            <option value="">
                Select user
            </option>

        </select>


        <label for="rating">
            Rating
        </label>

        <select id="rating">

            <option value="5">5 - Excellent</option>
            <option value="4">4 - Good</option>
            <option value="3">3 - Average</option>
            <option value="2">2 - Poor</option>
            <option value="1">1 - Very Poor</option>

        </select>


        <label for="feedback-comment">
            Comment
        </label>

        <textarea
            id="feedback-comment"
            rows="4"
            placeholder="Tell us about your experience..."
        ></textarea>


        <button
            type="button"
            onclick="submitFeedback()"
        >
            Submit Feedback
        </button>


        <p id="feedback-message"></p>

    </section>

</main>



<script>


let complaints = [];


// Load complaints

async function loadComplaints() {

    const response =
        await fetch(
            "/api/management/complaints"
        );

    const data =
        await response.json();


    if (!data.success) {
        return;
    }


    complaints =
        data.complaints;


    const select =
        document.getElementById(
            "complaint-select"
        );


    select.innerHTML =
        `<option value="">
            Select complaint
        </option>`;


    complaints.forEach(complaint => {

        select.innerHTML += `

            <option
                value="${complaint.complaint_id}"
            >
                #${complaint.complaint_id}
                -
                ${escapeHtml(
                    complaint.subject
                )}
                -
                ${escapeHtml(
                    complaint.status
                )}
            </option>

        `;

    });
}



// Load staff

async function loadStaff() {

    const response =
        await fetch(
            "/api/management/staff"
        );

    const data =
        await response.json();


    if (!data.success) {
        return;
    }


    const resolver =
        document.getElementById(
            "resolver"
        );


    resolver.innerHTML =
        `<option value="">
            Select staff member
        </option>`;


    data.staff.forEach(staff => {

        resolver.innerHTML += `

            <option
                value="${staff.user_id}"
            >
                ${escapeHtml(
                    staff.staff_name
                )}
                -
                ${escapeHtml(
                    staff.designation
                )}
            </option>

        `;

    });
}



// Load users

async function loadUsers() {

    const response =
        await fetch(
            "/api/users"
        );

    const data =
        await response.json();


    if (!data.success) {
        return;
    }


    [
        "closed-by",
        "feedback-user"
    ].forEach(id => {

        const select =
            document.getElementById(id);


        select.innerHTML =
            `<option value="">
                Select user
            </option>`;


        data.users.forEach(user => {

            select.innerHTML += `

                <option
                    value="${user.user_id}"
                >
                    ${escapeHtml(
                        user.name
                    )}
                </option>

            `;

        });

    });
}



// Complaint selected

document
    .getElementById(
        "complaint-select"
    )
    .addEventListener(
        "change",
        updateComplaintInfo
    );



function updateComplaintInfo() {

    const id =
        document.getElementById(
            "complaint-select"
        ).value;


    const complaint =
        complaints.find(
            c =>
                String(
                    c.complaint_id
                ) === String(id)
        );


    const info =
        document.getElementById(
            "complaint-info"
        );


    if (!complaint) {

        info.textContent =
            "";

        return;
    }


    info.innerHTML = `

        <strong>
            #${complaint.complaint_id}
            -
            ${escapeHtml(
                complaint.subject
            )}
        </strong>

        <br>

        Status:
        ${escapeHtml(
            complaint.status
        )}

        <br>

        User:
        ${escapeHtml(
            complaint.user_name
        )}

    `;
}



// Submit resolution

async function submitResolution() {

    const complaintId =
        document.getElementById(
            "complaint-select"
        ).value;


    const resolvedBy =
        document.getElementById(
            "resolver"
        ).value;


    const resolutionText =
        document.getElementById(
            "resolution-text"
        ).value;


    if (
        !complaintId ||
        !resolvedBy ||
        !resolutionText.trim()
    ) {

        alert(
            "Please select a complaint, staff member and enter a resolution."
        );

        return;
    }


    const response =
        await fetch(
            `/api/resolutions/complaints/${complaintId}`,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    resolved_by:
                        resolvedBy,

                    resolution_text:
                        resolutionText

                })
            }
        );


    const data =
        await response.json();


    document.getElementById(
        "resolution-message"
    ).textContent =
        data.message;


    if (data.success) {

        loadComplaints();

        document.getElementById(
            "resolution-text"
        ).value = "";
    }
}



// Close complaint

async function closeComplaint() {

    const complaintId =
        document.getElementById(
            "complaint-select"
        ).value;


    const closedBy =
        document.getElementById(
            "closed-by"
        ).value;


    const remarks =
        document.getElementById(
            "close-remarks"
        ).value;


    if (!complaintId || !closedBy) {

        alert(
            "Please select a complaint and user."
        );

        return;
    }


    const response =
        await fetch(
            `/api/resolutions/complaints/${complaintId}/close`,
            {

                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    closed_by:
                        closedBy,

                    remarks

                })
            }
        );


    const data =
        await response.json();


    document.getElementById(
        "close-message"
    ).textContent =
        data.message;


    if (data.success) {

        loadComplaints();
    }
}



// Submit feedback

async function submitFeedback() {

    const complaintId =
        document.getElementById(
            "complaint-select"
        ).value;


    const userId =
        document.getElementById(
            "feedback-user"
        ).value;


    const rating =
        document.getElementById(
            "rating"
        ).value;


    const comment =
        document.getElementById(
            "feedback-comment"
        ).value;


    if (!complaintId || !userId) {

        alert(
            "Please select a complaint and user."
        );

        return;
    }


    const response =
        await fetch(
            `/api/feedback/complaints/${complaintId}`,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    user_id:
                        userId,

                    rating,

                    comment

                })
            }
        );


    const data =
        await response.json();


    document.getElementById(
        "feedback-message"
    ).textContent =
        data.message;


    if (data.success) {

        document.getElementById(
            "feedback-comment"
        ).value = "";
    }
}



// HTML escaping

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}



// Initial loading

loadComplaints();

loadStaff();

loadUsers();

</script>

</body>

</html>
