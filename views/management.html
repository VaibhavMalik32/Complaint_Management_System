<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Complaint Management Dashboard</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

<main class="container">

    <h1>Complaint Management Dashboard</h1>

    <p class="subtitle">
        Assign complaints, update their status and track their history.
    </p>


    <section class="card">

        <div class="section-header">

            <h2>Complaints</h2>

            <button
                type="button"
                class="secondary"
                onclick="loadComplaints()"
            >
                Refresh
            </button>

        </div>


        <div id="complaint-list">

            Loading...

        </div>

    </section>

</main>


<script>


const statuses = [
    "Submitted",
    "Under Review",
    "Assigned",
    "In Progress",
    "Resolved",
    "Closed",
    "Rejected"
];


let staffMembers = [];



// Load staff

async function loadStaff() {

    try {

        const response =
            await fetch(
                "/api/management/staff"
            );

        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        staffMembers =
            data.staff;

    } catch (error) {

        console.error(
            "Failed to load staff:",
            error
        );
    }
}



// Load complaints

async function loadComplaints() {

    const list =
        document.getElementById(
            "complaint-list"
        );


    list.textContent =
        "Loading...";


    try {

        await loadStaff();


        const response =
            await fetch(
                "/api/management/complaints"
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        if (data.complaints.length === 0) {

            list.innerHTML =
                "<p>No complaints found.</p>";

            return;
        }


        list.innerHTML =
            data.complaints
                .map(
                    complaint =>
                        createComplaintCard(
                            complaint
                        )
                )
                .join("");


    } catch (error) {

        list.innerHTML =
            `<p class="error">
                ${escapeHtml(
                    error.message
                )}
            </p>`;
    }
}



// Create complaint card

function createComplaintCard(
    complaint
) {

    const staffOptions =
        staffMembers
            .map(
                staff => `
                    <option
                        value="${staff.staff_id}"
                        ${
                            String(
                                staff.staff_id
                            ) ===
                            String(
                                complaint.staff_id
                            )
                                ? "selected"
                                : ""
                        }
                    >
                        ${escapeHtml(
                            staff.staff_name
                        )}
                        -
                        ${escapeHtml(
                            staff.designation
                        )}
                    </option>
                `
            )
            .join("");


    const statusOptions =
        statuses
            .map(
                status => `
                    <option
                        value="${status}"
                        ${
                            status ===
                            complaint.status
                                ? "selected"
                                : ""
                        }
                    >
                        ${status}
                    </option>
                `
            )
            .join("");


    return `

        <article class="card">

            <h2>
                #${complaint.complaint_id}
                -
                ${escapeHtml(
                    complaint.subject
                )}
            </h2>


            <p>

                <strong>
                    User:
                </strong>

                ${escapeHtml(
                    complaint.user_name
                )}

            </p>


            <p>

                <strong>
                    Organization:
                </strong>

                ${escapeHtml(
                    complaint.organization_name
                )}

            </p>


            <p>

                <strong>
                    Category:
                </strong>

                ${escapeHtml(
                    complaint.category_name
                )}

            </p>


            <p>

                <strong>
                    Priority:
                </strong>

                ${escapeHtml(
                    complaint.priority
                )}

            </p>


            <p>

                <strong>
                    Description:
                </strong>

                ${escapeHtml(
                    complaint.description
                )}

            </p>


            <hr>


            <label>
                Assign Staff
            </label>


            <select
                id="staff-${complaint.complaint_id}"
            >

                <option value="">
                    Select staff member
                </option>

                ${staffOptions}

            </select>


            <button
                type="button"
                onclick="assignComplaint(
                    ${complaint.complaint_id}
                )"
            >
                Assign Complaint
            </button>


            <label>
                Status
            </label>


            <select
                id="status-${complaint.complaint_id}"
            >

                ${statusOptions}

            </select>


            <label>
                Remarks
            </label>


            <textarea
                id="remarks-${complaint.complaint_id}"
                rows="3"
                placeholder="Add remarks about this status change..."
            ></textarea>


            <button
                type="button"
                onclick="updateStatus(
                    ${complaint.complaint_id}
                )"
            >
                Update Status
            </button>


            <button
                type="button"
                class="secondary"
                onclick="showHistory(
                    ${complaint.complaint_id}
                )"
            >
                View History
            </button>


            <div
                id="history-${complaint.complaint_id}"
            ></div>

        </article>

    `;
}



// Assign complaint

async function assignComplaint(
    complaintId
) {

    const staffId =
        document.getElementById(
            `staff-${complaintId}`
        ).value;


    if (!staffId) {

        alert(
            "Please select a staff member."
        );

        return;
    }


    try {

        const response =
            await fetch(
                `/api/management/complaints/${complaintId}/assign`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        staff_id: staffId
                    })
                }
            );


        const data =
            await response.json();


        alert(data.message);


        if (data.success) {

            loadComplaints();
        }

    } catch (error) {

        alert(
            "Failed to assign complaint."
        );
    }
}



// Update status

async function updateStatus(
    complaintId
) {

    const status =
        document.getElementById(
            `status-${complaintId}`
        ).value;


    const remarks =
        document.getElementById(
            `remarks-${complaintId}`
        ).value;


    try {

        const response =
            await fetch(
                `/api/management/complaints/${complaintId}/status`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        status,

                        remarks

                    })
                }
            );


        const data =
            await response.json();


        alert(data.message);


        if (data.success) {

            loadComplaints();
        }

    } catch (error) {

        alert(
            "Failed to update status."
        );
    }
}



// Show complaint history

async function showHistory(
    complaintId
) {

    const container =
        document.getElementById(
            `history-${complaintId}`
        );


    try {

        const response =
            await fetch(
                `/api/management/complaints/${complaintId}/history`
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.message
            );
        }


        if (data.updates.length === 0) {

            container.innerHTML =
                "<p>No history available.</p>";

            return;
        }


        container.innerHTML = `

            <h3>
                Complaint History
            </h3>

            ${data.updates.map(
                update => `

                    <div
                        class="organization-item"
                    >

                        <div>

                            <strong>
                                ${escapeHtml(
                                    update.old_status ||
                                    "New"
                                )}
                                →
                                ${escapeHtml(
                                    update.new_status
                                )}
                            </strong>

                            <p>

                                ${escapeHtml(
                                    update.remarks ||
                                    "No remarks"
                                )}

                            </p>

                            <small>

                                Updated by:
                                ${escapeHtml(
                                    update.updated_by_name
                                )}

                                |
                                ${escapeHtml(
                                    update.updated_at
                                )}

                            </small>

                        </div>

                    </div>

                `
            ).join("")}

        `;

    } catch (error) {

        container.innerHTML =
            `<p class="error">
                ${escapeHtml(
                    error.message
                )}
            </p>`;
    }
}



// HTML escaping

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}



// Initial load

loadComplaints();

</script>

</body>

</html>
